<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Chrome RAM Watch</title>
  <desc id="description">A read-only PowerShell monitor for Chrome memory pressure on Windows.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#43d9ad"/>
      <stop offset="1" stop-color="#54a7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="1130" cy="84" r="220" fill="#176b87" opacity="0.14"/>
  <circle cx="1080" cy="560" r="260" fill="#234f88" opacity="0.12"/>

  <g transform="translate(72 76)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#accent)"/>
    <rect x="14" y="15" width="28" height="26" rx="4" fill="#07111f"/>
    <path d="M19 34h5v-9h5v9h5v-15h5v20H19z" fill="#43d9ad"/>
    <text x="0" y="106" fill="#f4f8ff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">Chrome RAM Watch</text>
    <text x="0" y="156" fill="#a9bdd2" font-family="Segoe UI, Arial, sans-serif" font-size="27">Find the Chrome process eating your RAM.</text>

    <g transform="translate(0 206)" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">
      <rect width="124" height="42" rx="21" fill="#17364b" stroke="#43d9ad" stroke-opacity="0.55"/>
      <text x="62" y="27" fill="#b9f8e5" text-anchor="middle">READ-ONLY</text>
      <rect x="138" width="160" height="42" rx="21" fill="#17364b" stroke="#54a7ff" stroke-opacity="0.55"/>
      <text x="218" y="27" fill="#c7e3ff" text-anchor="middle">NO EXTENSION</text>
      <rect x="312" width="118" height="42" rx="21" fill="#17364b" stroke="#9c88ff" stroke-opacity="0.55"/>
      <text x="371" y="27" fill="#ded7ff" text-anchor="middle">WINDOWS</text>
    </g>

    <text x="0" y="316" fill="#7f98ae" font-family="Segoe UI, Arial, sans-serif" font-size="20">PowerShell 5.1+  •  MIT licensed  •  JSON output</text>
  </g>

  <g transform="translate(610 94)" filter="url(#shadow)">
    <rect width="598" height="452" rx="18" fill="#08131f" stroke="#2a4861"/>
    <rect width="598" height="48" rx="18" fill="#14283a"/>
    <rect y="30" width="598" height="18" fill="#14283a"/>
    <circle cx="25" cy="24" r="6" fill="#ff6b6b"/>
    <circle cx="45" cy="24" r="6" fill="#ffd166"/>
    <circle cx="65" cy="24" r="6" fill="#43d9ad"/>
    <text x="299" y="30" fill="#91a9bd" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">PowerShell</text>

    <g transform="translate(28 78)" font-family="Cascadia Mono, Consolas, monospace">
      <text x="0" y="0" fill="#55deb3" font-size="20" font-weight="700">Chrome RAM Watch (read-only)</text>
      <text x="0" y="34" fill="#d5e4f0" font-size="15">Stable Chrome  |  root PID 10536</text>
      <text x="0" y="60" fill="#8da9be" font-size="14">Browser process tree, may contain profiles</text>

      <text x="0" y="108" fill="#a9bdd2" font-size="15">System commit</text>
      <rect x="150" y="94" width="345" height="16" rx="8" fill="#1d3447"/>
      <rect x="150" y="94" width="117" height="16" rx="8" fill="#43d9ad"/>
      <text x="510" y="108" fill="#d5e4f0" font-size="15">34%</text>

      <text x="0" y="147" fill="#a9bdd2" font-size="15">Chrome working set</text>
      <text x="510" y="147" fill="#f4f8ff" font-size="16" font-weight="700" text-anchor="end">6.37 GB</text>
      <text x="0" y="178" fill="#a9bdd2" font-size="15">Page-read operations/sec</text>
      <text x="510" y="178" fill="#55deb3" font-size="16" font-weight="700" text-anchor="end">0</text>

      <line x1="0" y1="205" x2="540" y2="205" stroke="#244257"/>
      <text x="0" y="235" fill="#7895ab" font-size="13">PID</text>
      <text x="95" y="235" fill="#7895ab" font-size="13">TYPE</text>
      <text x="410" y="235" fill="#7895ab" font-size="13">WORKING SET</text>

      <text x="0" y="270" fill="#d5e4f0" font-size="15">36924</text>
      <text x="95" y="270" fill="#d5e4f0" font-size="15">renderer</text>
      <text x="540" y="270" fill="#f3c969" font-size="15" text-anchor="end">633 MB</text>
      <text x="0" y="304" fill="#d5e4f0" font-size="15">40564</text>
      <text x="95" y="304" fill="#d5e4f0" font-size="15">renderer</text>
      <text x="540" y="304" fill="#d5e4f0" font-size="15" text-anchor="end">457 MB</text>
      <text x="0" y="338" fill="#d5e4f0" font-size="15">15592</text>
      <text x="95" y="338" fill="#d5e4f0" font-size="15">renderer</text>
      <text x="540" y="338" fill="#d5e4f0" font-size="15" text-anchor="end">415 MB</text>
    </g>
  </g>
</svg>
