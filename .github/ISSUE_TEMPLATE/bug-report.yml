name: Bug report
description: Report incorrect output, a crash, or unexpected behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove personal paths, URLs, profile names, and raw command lines before submitting.
  - type: input
    id: version
    attributes:
      label: Chrome RAM Watch version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: powershell
    attributes:
      label: PowerShell version
      description: Required for watcher reports. Run $PSVersionTable.PSVersion to find it.
      placeholder: 7.6.4
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - PowerShell watcher
        - Optional cleanup companion
        - Release package or documentation
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      description: Required for cleanup-companion reports. For reports that do not involve the companion, enter Not applicable.
      placeholder: 140.0.0.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or exact UI steps
      description: Enter the PowerShell command, or for companion reports list every popup action in order and name the Chrome window type, regular or incognito.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal URLs, browser history, raw command lines, and credentials.
          required: true
