name: Feature request
description: Suggest a focused improvement that preserves the component safety contracts.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the diagnostic problem, not only the proposed interface.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Would this read or emit new data?
      options:
        - No
        - Yes
        - Unsure
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety contract
      options:
        - label: This proposal does not require closing tabs, ending processes, background cleanup, page-content collection, telemetry, or network access.
          required: true
        - label: Any proposed tab discard remains in the optional companion and requires exact review, separate confirmation, and final-state revalidation.
          required: true
